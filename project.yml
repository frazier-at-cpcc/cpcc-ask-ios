name: AskCPCC
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: edu.cpcc
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad

targets:
  AskCPCC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AskCPCC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cpcc.AskCPCC
        INFOPLIST_FILE: AskCPCC/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AskCPCC/Info.plist
      properties:
        CFBundleDisplayName: Ask CPCC
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi
        basedOnDependencyAnalysis: false

  AskCPCCTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AskCPCCTests
    dependencies:
      - target: AskCPCC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cpcc.AskCPCCTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AskCPCC:
    build:
      targets:
        AskCPCC: all
        AskCPCCTests: [test]
    test:
      targets: [AskCPCCTests]
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
